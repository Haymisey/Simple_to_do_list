<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavender Tasks</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style/styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Filters</h2>
        <div class="filters">
          <button data-filter="all" class="active">All Tasks</button>
          <button data-filter="pending">Pending</button>
          <button data-filter="completed">Completed</button>
        </div>
        <div class="calendar" id="calendar"></div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <h1>My Tasks</h1>
        <div class="search-bar">
          <input type="text" placeholder="Search tasks..." id="searchInput" />
          <i
            class="fa-solid fa-magnifying-glass"
            style="color: var(--accent)"
          ></i>
        </div>

        <div class="task-grid" id="taskList">
          <!-- Tasks will be inserted here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" style="display: none">
          <h2>No Tasks Found</h2>
          <p>Click the + button to create your first task!</p>
        </div>
      </main>

      <!-- Mobile Menu -->
      <nav class="mobile-menu">
        <button data-filter="all">All</button>
        <button data-filter="pending">Pending</button>
        <button data-filter="completed">Completed</button>
      </nav>

      <!-- Floating Action Button -->
      <div class="fab" id="fab">+</div>

      <!-- Task Editor Modal -->
      <div class="editor-modal" id="editorModal">
        <div class="editor-content">
          <div id="taskEditorContainer"></div>
          <div class="format-toolbar">
            <input type="date" id="dueDate" class="date-picker" />
            <button id="voiceButton" class="voice-btn">
              <img src="images/mic.png" alt="microphone" />
            </button>
          </div>
          <div class="modal-actions">
            <button id="saveTask" class="save-btn">Save</button>
            <button id="cancelEdit" class="cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="script/script.js"></script>
  </body>
</html>
